name: loredock

services:
  database:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${LOREDOCK_DB_NAME:-loredock}
      POSTGRES_USER: ${LOREDOCK_DB_USER:-loredock}
      POSTGRES_PASSWORD: ${LOREDOCK_DB_PASSWORD:-loredock_local_only}
    ports:
      - "${LOREDOCK_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
