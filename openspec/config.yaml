schema: spec-driven

context: |
  项目名称：LoreDock。
  产品定位：面向开发团队的项目业务上下文知识平台，统一管理公司 Wiki、项目文档、需求、PR/Commit、测试证据和轻量代码快照，并通过 Web 与 MCP 提供带引用的业务上下文。
  当前需求基线：docs/product/项目业务上下文知识库_MVP需求文档_v1.0.md。
  技术方向：Java + Spring Boot 后端，Vue 3 + TypeScript 前端，PostgreSQL + pgvector，Apache Lucene，公司 MiniMax 2.7，CPU Embedding，Streamable HTTP MCP。
  开发方法：SDD + TDD。涉及行为的改动先完成 OpenSpec，再按红—绿—重构实现。
  后端要求：先定义契约、DTO、领域端口或 Java 接口，再写实现。公共接口、实现类和关键业务逻辑使用中文注释说明职责、原因、规则和风险。
  测试要求：测试必须服务真实业务场景；每个测试用例使用中文注释说明业务目的和防止的回归，不以数量或覆盖率作为目标。
  安全边界：公开仓库不得包含公司内部代码、Wiki 原文、凭据、内部地址或真实敏感数据。

rules:
  proposal:
    - 使用中文说明问题、目标、业务价值、范围和非目标
    - 指出改动依据的当前产品文档或已有规格
    - 不把未来规划混入本次变更范围
  specs:
    - 使用可观察、可测试的行为描述，并覆盖正常场景、重要边界和失败行为
    - 涉及检索时明确项目、分支、知识范围、引用和拒答条件
    - 涉及接口时明确请求、响应、错误语义、幂等性和兼容性
  design:
    - 明确接口优先的契约、模块边界、数据流、事务边界和错误处理
    - 标出需要中文注释解释的关键业务规则、兼容要求和风险
    - 给出最小且有业务意义的测试策略，不以测试数量或覆盖率为设计目标
  tasks:
    - 按契约或接口、失败测试、最小实现、重构和验证的顺序拆分任务
    - 每项业务实现任务都要包含对应的有意义测试和注释检查
    - 任务应足够小且有明确完成条件，禁止使用“完善功能”一类模糊描述

operations:
  apply:
    guidance:
      - 严格执行 TDD，先确认测试因目标行为缺失而失败，再编写最小实现
      - 后端先写接口或契约，再写实现，不根据既有实现反推接口
      - 每个测试用例必须有中文注释说明业务目的和防止的回归
      - 公共接口、实现类和关键业务逻辑必须有说明职责、原因、规则或风险的中文注释
      - 只运行和保留真正有业务意义的测试，不为数量或覆盖率堆砌用例
  archive:
    guidance:
      - 归档前确认实现与规格一致、相关测试通过且 tasks 已同步
      - 归档摘要说明验证过的业务场景和仍然存在的限制
