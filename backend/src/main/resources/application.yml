spring:
  application:
    name: loredock
  datasource:
    url: ${LOREDOCK_DB_URL:jdbc:postgresql://localhost:5432/loredock}
    username: ${LOREDOCK_DB_USER:loredock}
    password: ${LOREDOCK_DB_PASSWORD:loredock_local_only}
  flyway:
    enabled: true
    validate-on-migrate: true
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  port: ${LOREDOCK_BACKEND_PORT:8080}

sa-token:
  token-name: loredock_session
  timeout: ${LOREDOCK_WEB_SESSION_TIMEOUT_SECONDS:1800}
  is-read-header: false
  is-read-body: false
  is-read-cookie: true
  is-write-header: false
  is-lasting-cookie: true
  cookie:
    path: /
    secure: ${LOREDOCK_WEB_COOKIE_SECURE:false}
    http-only: true
    same-site: Strict

mybatis-plus:
  type-handlers-package: io.github.loredock.platform.persistence
  configuration:
    # 所有实体均显式声明列名，关闭隐式驼峰映射可防止遗漏注解被静默接受。
    map-underscore-to-camel-case: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health

loredock:
  demo:
    seed-enabled: ${LOREDOCK_DEMO_SEED_ENABLED:false}
  identity:
    mcp:
      # 仅接受原始高熵 Token 的小写 SHA-256 摘要；缺失时服务拒绝就绪。
      token-sha256: ${LOREDOCK_MCP_TOKEN_SHA256:}
  storage:
    root: ${LOREDOCK_STORAGE_ROOT:./data/objects}
  jobs:
    core-pool-size: ${LOREDOCK_JOB_CORE_POOL_SIZE:2}
    max-pool-size: ${LOREDOCK_JOB_MAX_POOL_SIZE:4}
    queue-capacity: ${LOREDOCK_JOB_QUEUE_CAPACITY:32}
    shutdown-await: ${LOREDOCK_JOB_SHUTDOWN_AWAIT:30s}
    stale-heartbeat: ${LOREDOCK_JOB_STALE_HEARTBEAT:5m}
