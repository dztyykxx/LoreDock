spring:
  application:
    name: loredock
  ai:
    # MVP 默认不创建任何外部模型 Bean；启用 Agent 时仅显式打开 chat=openai。
    model:
      chat: ${LOREDOCK_AGENT_CHAT_PROVIDER:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${LOREDOCK_AGENT_MODEL_API_KEY:}
      base-url: ${LOREDOCK_AGENT_MODEL_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${LOREDOCK_AGENT_MODEL_NAME:deepseek-v4-flash}
          temperature: 0.0
          parallel-tool-calls: false
          internal-tool-execution-enabled: false
          stream-usage: true
  servlet:
    multipart:
      max-file-size: ${LOREDOCK_MULTIPART_MAX_FILE_SIZE:100MB}
      # multipart 还包含 JSON options 和边界字节，请求上限需略高于文件上限。
      max-request-size: ${LOREDOCK_MULTIPART_MAX_REQUEST_SIZE:101MB}
  datasource:
    url: ${LOREDOCK_DB_URL:jdbc:postgresql://localhost:5432/loredock}
    username: ${LOREDOCK_DB_USER:loredock}
    password: ${LOREDOCK_DB_PASSWORD:loredock_local_only}
  flyway:
    enabled: true
    validate-on-migrate: true
  jackson:
    time-zone: UTC
    serialization:
      # HTTP 契约使用 ISO-8601 字符串，避免 Boot/Jackson 版本差异把时间改为数值时间戳。
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful
  port: ${LOREDOCK_BACKEND_PORT:8080}

sa-token:
  token-name: loredock_session
  timeout: ${LOREDOCK_WEB_SESSION_TIMEOUT_SECONDS:1800}
  is-read-header: false
  is-read-body: false
  is-read-cookie: true
  is-write-header: false
  is-lasting-cookie: true
  cookie:
    path: /
    secure: ${LOREDOCK_WEB_COOKIE_SECURE:false}
    http-only: true
    same-site: Strict

mybatis-plus:
  type-handlers-package: io.github.loredock.platform.persistence
  configuration:
    # 所有实体均显式声明列名，关闭隐式驼峰映射可防止遗漏注解被静默接受。
    map-underscore-to-camel-case: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health

loredock:
  agent:
    enabled: ${LOREDOCK_AGENT_ENABLED:false}
    model:
      provider: openai-compatible
      name: ${LOREDOCK_AGENT_MODEL_NAME:deepseek-v4-flash}
      base-url: ${LOREDOCK_AGENT_MODEL_BASE_URL:https://api.deepseek.com}
      api-key: ${LOREDOCK_AGENT_MODEL_API_KEY:}
      connect-timeout: ${LOREDOCK_AGENT_MODEL_CONNECT_TIMEOUT:5s}
      read-timeout: ${LOREDOCK_AGENT_MODEL_READ_TIMEOUT:60s}
      max-retries: ${LOREDOCK_AGENT_MODEL_MAX_RETRIES:1}
    policy:
      output-schema-version: project-qa-v1
    limits:
      max-steps: ${LOREDOCK_AGENT_MAX_STEPS:8}
      max-model-calls: ${LOREDOCK_AGENT_MAX_MODEL_CALLS:8}
      total-timeout: ${LOREDOCK_AGENT_TOTAL_TIMEOUT:90s}
      max-results-per-tool: ${LOREDOCK_AGENT_MAX_RESULTS_PER_TOOL:10}
      max-snippet-characters: ${LOREDOCK_AGENT_MAX_SNIPPET_CHARACTERS:2000}
      max-context-characters: ${LOREDOCK_AGENT_MAX_CONTEXT_CHARACTERS:24000}
      max-answer-characters: ${LOREDOCK_AGENT_MAX_ANSWER_CHARACTERS:8000}
      max-events: ${LOREDOCK_AGENT_MAX_EVENTS:200}
      minimum-relevance: ${LOREDOCK_AGENT_MINIMUM_RELEVANCE:0.20}
    executor:
      core-pool-size: ${LOREDOCK_AGENT_EXECUTOR_CORE_POOL_SIZE:2}
      max-pool-size: ${LOREDOCK_AGENT_EXECUTOR_MAX_POOL_SIZE:4}
      queue-capacity: ${LOREDOCK_AGENT_EXECUTOR_QUEUE_CAPACITY:16}
      shutdown-await: ${LOREDOCK_AGENT_EXECUTOR_SHUTDOWN_AWAIT:30s}
  qa:
    sse:
      heartbeat-interval: ${LOREDOCK_QA_SSE_HEARTBEAT_INTERVAL:15s}
      max-duration: ${LOREDOCK_QA_SSE_MAX_DURATION:6m}
      batch-size: ${LOREDOCK_QA_SSE_BATCH_SIZE:200}
      core-pool-size: ${LOREDOCK_QA_SSE_CORE_POOL_SIZE:2}
      max-pool-size: ${LOREDOCK_QA_SSE_MAX_POOL_SIZE:8}
      queue-capacity: ${LOREDOCK_QA_SSE_QUEUE_CAPACITY:32}
      shutdown-await: ${LOREDOCK_QA_SSE_SHUTDOWN_AWAIT:10s}
  demo:
    seed-enabled: ${LOREDOCK_DEMO_SEED_ENABLED:false}
  identity:
    web:
      accounts:
        - username: ${LOREDOCK_ADMIN_USERNAME:}
          display-name: ${LOREDOCK_ADMIN_DISPLAY_NAME:}
          role: ADMIN
          password-hash: ${LOREDOCK_ADMIN_PASSWORD_HASH:}
        - username: ${LOREDOCK_MEMBER_USERNAME:}
          display-name: ${LOREDOCK_MEMBER_DISPLAY_NAME:}
          role: MEMBER
          password-hash: ${LOREDOCK_MEMBER_PASSWORD_HASH:}
  storage:
    root: ${LOREDOCK_STORAGE_ROOT:./data/objects}
  code:
    snapshot:
      max-upload-size: ${LOREDOCK_CODE_SNAPSHOT_MAX_UPLOAD_SIZE:100MB}
      max-archive-entries: ${LOREDOCK_CODE_SNAPSHOT_MAX_ARCHIVE_ENTRIES:50000}
      max-archive-entry-uncompressed-size: ${LOREDOCK_CODE_SNAPSHOT_MAX_ARCHIVE_ENTRY_UNCOMPRESSED_SIZE:100MB}
      max-indexed-file-size: ${LOREDOCK_CODE_SNAPSHOT_MAX_INDEXED_FILE_SIZE:2MB}
      max-archive-uncompressed-size: ${LOREDOCK_CODE_SNAPSHOT_MAX_ARCHIVE_UNCOMPRESSED_SIZE:1GB}
      max-compression-ratio: ${LOREDOCK_CODE_SNAPSHOT_MAX_COMPRESSION_RATIO:100}
      max-search-snippet-chars: ${LOREDOCK_CODE_SNAPSHOT_MAX_SEARCH_SNIPPET_CHARS:2000}
      work-root: ${LOREDOCK_CODE_SNAPSHOT_WORK_ROOT:./data/work/code}
      index-root: ${LOREDOCK_CODE_SNAPSHOT_INDEX_ROOT:./data/indexes/code}
  knowledge:
    importing:
      max-upload-size: ${LOREDOCK_KNOWLEDGE_IMPORT_MAX_UPLOAD_SIZE:20MB}
      max-archive-entries: ${LOREDOCK_KNOWLEDGE_IMPORT_MAX_ARCHIVE_ENTRIES:200}
      max-entry-uncompressed-size: ${LOREDOCK_KNOWLEDGE_IMPORT_MAX_ENTRY_UNCOMPRESSED_SIZE:2MB}
      max-archive-uncompressed-size: ${LOREDOCK_KNOWLEDGE_IMPORT_MAX_ARCHIVE_UNCOMPRESSED_SIZE:50MB}
      max-compression-ratio: ${LOREDOCK_KNOWLEDGE_IMPORT_MAX_COMPRESSION_RATIO:100}
    search:
      embedding:
        # 模型和 tokenizer 必须由部署环境离线准备；空配置只允许关键词检索，语义入口明确返回 503。
        model-id: ${LOREDOCK_KNOWLEDGE_EMBEDDING_MODEL_ID:BAAI/bge-small-zh-v1.5}
        model-uri: ${LOREDOCK_KNOWLEDGE_EMBEDDING_MODEL_URI:}
        tokenizer-uri: ${LOREDOCK_KNOWLEDGE_EMBEDDING_TOKENIZER_URI:}
        checksum: ${LOREDOCK_KNOWLEDGE_EMBEDDING_MODEL_SHA256:}
        output-name: ${LOREDOCK_KNOWLEDGE_EMBEDDING_OUTPUT_NAME:sentence_embedding}
        max-tokens: ${LOREDOCK_KNOWLEDGE_EMBEDDING_MAX_TOKENS:512}
        query-instruction: ${LOREDOCK_KNOWLEDGE_EMBEDDING_QUERY_INSTRUCTION:为这个句子生成表示以用于检索相关文章：}
  jobs:
    core-pool-size: ${LOREDOCK_JOB_CORE_POOL_SIZE:2}
    max-pool-size: ${LOREDOCK_JOB_MAX_POOL_SIZE:4}
    queue-capacity: ${LOREDOCK_JOB_QUEUE_CAPACITY:32}
    shutdown-await: ${LOREDOCK_JOB_SHUTDOWN_AWAIT:30s}
    stale-heartbeat: ${LOREDOCK_JOB_STALE_HEARTBEAT:5m}
